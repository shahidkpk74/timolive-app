class LoginPage extends StatefulWidget {
  const LoginPage({super.key});

  @override
  State<LoginPage> createState() => _LoginPageState();
}

class _LoginPageState extends State<LoginPage> {
  final emailController = TextEditingController();
  final passwordController = TextEditingController();
  final AuthService authService = AuthService();
  bool loading = false;

  Future<void> login() async {
    setState(() => loading = true);
    try {
      await authService.signInWithEmail(emailController.text.trim(), passwordController.text.trim());
    } catch (e) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString())));
      }
    }
    setState(() => loading = false);
  }

  Future<void> register() async {
    setState(() => loading = true);
    try {
      await authService.registerWithEmail(emailController.text.trim(), passwordController.text.trim());
    } catch (e) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString())));
      }
    }
    setState(() => loading = false);
  }

  Future<void> guestLogin() async {
    setState(() => loading = true);
    try {
      await authService.signInGuest();
    } catch (e) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString())));
      }
    }
    setState(() => loading = false);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Padding(
        padding: const EdgeInsets.all(24),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            const Text('Timo Live Login', style: TextStyle(fontSize: 34, fontWeight: FontWeight.bold)),
            const SizedBox(height: 30),
            TextField(controller: emailController, decoration: const InputDecoration(labelText: 'Email')),
            const SizedBox(height: 20),
            TextField(controller: passwordController, obscureText: true, decoration: const InputDecoration(labelText: 'Password')),
            const SizedBox(height: 30),
            SizedBox(
              width: double.infinity,
              child: ElevatedButton(onPressed: loading ? null : login, child: const Text('Login')),
            ),
            const SizedBox(height: 12),
            SizedBox(
              width: double.infinity,
              child: OutlinedButton(onPressed: loading ? null : register, child: const Text('Register')),
            ),
            TextButton(onPressed: loading ? null : guestLogin, child: const Text('Continue as Guest')),
          ],
        ),
      ),
    );
  }
}

class MatchPage extends StatefulWidget {
  const MatchPage({super.key});

  @override
  State<MatchPage> createState() => _MatchPageState();
}

class _MatchPageState extends State<MatchPage> {
  final AgoraService agoraService = AgoraService();
  bool inCall = false;

  @override
  void initState() {
    super.initState();
    agoraService.initialize();
  }

  Future<void> startCall() async {
    // WARNING: Never use hardcoded tokens in production. Use a token server.
    const tempToken = 'YOUR_TEMP_TOKEN';
    const channelId = 'timolive_room';
    
    await agoraService.joinVideoCall(channelId: channelId, token: tempToken);
    setState(() => inCall = true);
  }

  Future<void> endCall() async {
    await agoraService.leaveChannel();
    setState(() => inCall = false);
  }

  @override
  void dispose() {
    agoraService.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Random Match'), backgroundColor: Colors.transparent),
      body: Padding(
        padding: const EdgeInsets.all(20),
        child: Column(
          children: [
            Expanded(
              child: Container(
                width: double.infinity,
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(30),
                  gradient: const LinearGradient(colors: [Colors.deepPurple, Colors.blueAccent]),
                ),
                child: Center(
                  child: Icon(inCall ? Icons.videocam : Icons.video_call, size: 120, color: Colors.white),
                ),
              ),
            ),
            const SizedBox(height: 30),
            SizedBox(
              width: double.infinity,
              height: 65,
              child: ElevatedButton(
                style: ElevatedButton.styleFrom(
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                  backgroundColor: inCall ? Colors.red : Colors.purple,
                ),
                onPressed: inCall ? endCall : startCall,
                child: Text(inCall ? 'End Call' : 'Start Matching', style: const TextStyle(fontSize: 22)),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class WalletPage extends StatefulWidget {
  const WalletPage({super.key});

  @override
  State<WalletPage> createState() => _WalletPageState();
}

class _WalletPageState extends State<WalletPage> {
  final InAppPurchase _inAppPurchase = InAppPurchase.instance;

  final List<Map<String, String>> packages = [
    {'id': 'coins_100', 'coins': '100 Coins', 'price': '\$0.99'},
    {'id': 'coins_500', 'coins': '500 Coins', 'price': '\$4.99'},
    {'id': 'coins_1000', 'coins': '1000 Coins', 'price': '\$9.99'},
    {'id': 'coins_5000', 'coins': '5000 Coins', 'price': '\$49.99'},
  ];

  Future<void> buyCoins(String productId) async {
    final bool available = await _inAppPurchase.isAvailable();
    if (!available) {
      if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Store unavailable')));
      return;
    }

    final ProductDetailsResponse response = await _inAppPurchase.queryProductDetails({productId});
    if (response.productDetails.isEmpty) {
      if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Product not found')));
      return;
    }

    final PurchaseParam purchaseParam = PurchaseParam(productDetails: response.productDetails.first);
    _inAppPurchase.buyConsumable(purchaseParam: purchaseParam);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Wallet'), backgroundColor: Colors.transparent),
      body: Padding(
        padding: const EdgeInsets.all(20),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Container(
              width: double.infinity,
              padding: const EdgeInsets.all(24),
              decoration: BoxDecoration(
                borderRadius: BorderRadius.circular(30),
                gradient: const LinearGradient(colors: [Colors.orange, Colors.deepOrange]),
              ),
              child: const Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text('Current Balance', style: TextStyle(fontSize: 18)),
                  SizedBox(height: 10),
                  Text('2,450 Coins', style: TextStyle(fontSize: 34, fontWeight: FontWeight.bold)),
                ],
              ),
            ),
            const SizedBox(height: 30),
            const Text('Buy Coins', style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold)),
            const SizedBox(height: 20),
            Expanded(
              child: ListView.builder(
                itemCount: packages.length,
                itemBuilder: (context, index) {
                  return Container(
                    margin: const EdgeInsets.only(bottom: 16),
                    padding: const EdgeInsets.all(20),
                    decoration: BoxDecoration(color: const Color(0xFF131A2A), borderRadius: BorderRadius.circular(20)),
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        Text(packages[index]['coins']!, style: const TextStyle(fontSize: 20)),
                        ElevatedButton(
                          onPressed: () => buyCoins(packages[index]['id']!),
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.purple),
                          child: Text(packages[index]['price']!),
                        ),
                      ],
                    ),
                  );
                },
              ),
            ),
          ],
        ),
      ),
    );
  }
}

