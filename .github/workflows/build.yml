Future<void> main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Firebase.initializeApp();
  await PushNotificationService.initialize();
  runApp(const TimoLiveApp());
}

class AppConfig {
  // Replace with your real Agora App ID
  static const String agoraAppId = 'YOUR_AGORA_APP_ID';
  static const String firebaseProject = 'timolive-production';
}

class PushNotificationService {
  static final FirebaseMessaging messaging = FirebaseMessaging.instance;

  static Future<void> initialize() async {
    await messaging.requestPermission();
    String? token = await messaging.getToken();
    
  }
}

class AuthService {
  final FirebaseAuth _auth = FirebaseAuth.instance;

  Stream<User?> get authStateChanges => _auth.authStateChanges();

  Future<UserCredential> signInGuest() async {
    return await _auth.signInAnonymously();
  }

  Future<UserCredential> signInWithEmail(String email, String password) async {
    return await _auth.signInWithEmailAndPassword(
      email: email,
      password: password,
    );
  }

  Future<UserCredential> registerWithEmail(String email, String password) async {
    return await _auth.createUserWithEmailAndPassword(
      email: email,
      password: password,
    );
  }

  Future<void> signOut() async {
    await _auth.signOut();
  }
}

class DatabaseService {
  final FirebaseFirestore firestore = FirebaseFirestore.instance;

  Future<void> saveMessage({
    required String senderId,
    required String message,
  }) async {
    await firestore.collection('messages').add({
      'senderId': senderId,
      'message': message,
      'timestamp': Timestamp.now(),
    });
  }

  Stream<QuerySnapshot> getMessages() {
    return firestore
        .collection('messages')
        .orderBy('timestamp', descending: true)
        .limit(50)
        .snapshots();
  }
}

class AgoraService {
  late final RtcEngine engine;
  bool _initialized = false;

  Future<void> initialize() async {
    if (_initialized) return;
    engine = createAgoraRtcEngine();
    await engine.initialize(RtcEngineContext(appId: AppConfig.agoraAppId));
    await engine.enableVideo();
    _initialized = true;
  }

  Future<void> joinVideoCall({required String channelId, required String token}) async {
    await engine.joinChannel(
      token: token,
      channelId: channelId,
      uid: 0,
      options: const ChannelMediaOptions(),
    );
  }

  Future<void> leaveChannel() async {
    await engine.leaveChannel();
  }

  Future<void> dispose() async {
    await engine.release();
  }
}

