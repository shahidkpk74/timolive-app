  Future<void> sendMessage() async {
    if (controller.text.trim().isEmpty) return;
    await databaseService.saveMessage(
      senderId: FirebaseAuth.instance.currentUser?.uid ?? 'anonymous',
      message: controller.text.trim(),
    );
    controller.clear();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Real-Time Chat')),
      body: Column(
        children: [
          Expanded(
            child: StreamBuilder<QuerySnapshot>(
              stream: databaseService.getMessages(),
              builder: (context, snapshot) {
                if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                final docs = snapshot.data!.docs;
                return ListView.builder(
                  reverse: true,
                  itemCount: docs.length,
                  itemBuilder: (context, index) {
                    final data = docs[index].data() as Map<String, dynamic>;
                    return ListTile(title: Text(data['message'] ?? ''));
                  },
                );
              },
            ),
          ),
          Padding(
            padding: const EdgeInsets.all(12),
            child: Row(
              children: [
                Expanded(child: TextField(controller: controller, decoration: const InputDecoration(hintText: 'Type message...'))),
                IconButton(onPressed: sendMessage, icon: const Icon(Icons.send)),
              ],
     
